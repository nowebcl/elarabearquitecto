<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Edición Visual en Vivo | El Arabe Arquitecto</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- TOP ADMIN BAR (VISIBLE WHEN LOGGED IN) -->
  <header class="admin-top-bar" id="adminTopBar" style="display: none;">
    <div class="top-bar-brand">
      <img src="assets/logo2.png" alt="El Arabe Arquitecto" class="admin-bar-logo">
      <span class="admin-mode-tag"><i class="fa-solid fa-wand-magic-sparkles"></i> MODO EDICIÓN</span>
    </div>

    <!-- CENTER TABS -->
    <div class="top-bar-tabs">
      <button class="top-tab-btn active" id="tabBtnVisualEditor" data-target="viewVisualEditor">
        <i class="fa-solid fa-pen-to-square"></i> EDICIÓN VISUAL (WEB)
      </button>
      <button class="top-tab-btn" id="tabBtnConsultas" data-target="viewConsultas">
        <i class="fa-solid fa-inbox"></i> CONSULTAS RECIBIDAS <span id="topConsultasBadge" class="badge-count">0</span>
      </button>
    </div>

    <!-- RIGHT ACTION BUTTONS -->
    <div class="top-bar-actions">
      <button id="btnTopSaveLive" class="btn-top-save">
        <i class="fa-solid fa-floppy-disk"></i> <span>GUARDAR CAMBIOS</span>
      </button>
      <button id="btnTopLogout" class="btn-top-logout">
        <i class="fa-solid fa-right-from-bracket"></i> <span>CERRAR SESIÓN</span>
      </button>
    </div>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="toast-notification"></div>

  <!-- MAIN ADMIN VIEWS -->
  <main class="admin-main-wrapper">
    
    <!-- 1. LOGIN VIEW (PROTECTED ROUTE) -->
    <div id="loginView" class="login-card">
      <div class="login-header">
        <i class="fa-solid fa-lock login-icon"></i>
        <h2>Acceso al Panel de Edición</h2>
        <p>Inicia sesión con tus credenciales de Administrador</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="admin-form-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="admin@elarabearquitecto.cl" required autocomplete="username">
        </div>

        <div class="admin-form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <div id="loginError" class="login-error-msg" style="display: none;"></div>

        <button type="submit" id="btnLogin" class="btn-primary-admin">
          <span>INICIAR SESIÓN</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer-info">
        <small><i class="fa-solid fa-shield-halved"></i> Panel seguro de administración CMS.</small>
      </div>
    </div>

    <!-- 2. LIVE VISUAL EDITOR VIEW (IFRAME OF LANDING PAGE) -->
    <div id="viewVisualEditor" class="admin-view-panel active" style="display: none;">
      <iframe src="index.html" id="visualEditorIframe" class="visual-editor-iframe"></iframe>
    </div>

    <!-- 3. CONSULTAS RECIBIDAS VIEW -->
    <div id="viewConsultas" class="admin-view-panel" style="display: none;">
      <div class="container" style="padding-top: 2rem;">
        <div class="panel-card">
          <div class="panel-header">
            <div>
              <h3><i class="fa-solid fa-envelope-open-text" style="color: #d4af37;"></i> Mensajes y Consultas Recibidas</h3>
              <p>Revisa las solicitudes de cotización y regularización enviadas desde el sitio web.</p>
            </div>
          </div>

          <div id="adminConsultasList" class="consultas-table-wrapper">
            <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando consultas de Firestore...</div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- FIREBASE SDK & ADMIN SCRIPT -->
  <script type="module" src="admin.js"></script>
</body>
</html>
