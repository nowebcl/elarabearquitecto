<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin CMS | El Arabe Arquitecto</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- MINIMAL MOBILE-FRIENDLY TOP ADMIN BAR (NO LOGO) -->
  <header class="admin-top-bar" id="adminTopBar" style="display: none;">
    <div class="top-bar-tabs">
      <button class="top-tab-btn active" id="tabBtnVisualEditor">
        <i class="fa-solid fa-pen-to-square"></i> <span class="tab-label">Web</span>
      </button>
      <button class="top-tab-btn" id="tabBtnConsultas">
        <i class="fa-solid fa-inbox"></i> <span class="tab-label">Consultas</span> <span id="topConsultasBadge" class="badge-count">0</span>
      </button>
    </div>

    <div class="top-bar-actions">
      <button id="btnTopSaveLive" class="btn-top-save" title="Guardar Cambios">
        <i class="fa-solid fa-floppy-disk"></i> <span class="save-label">Guardar</span>
      </button>
      <button id="btnTopLogout" class="btn-top-logout" title="Cerrar Sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="toast-notification"></div>

  <!-- MAIN ADMIN VIEWS -->
  <main class="admin-main-wrapper">
    
    <!-- 1. LOGIN VIEW -->
    <div id="loginView" class="login-card">
      <div class="login-header">
        <i class="fa-solid fa-lock login-icon"></i>
        <h2>Acceso Administración</h2>
        <p>Inicia sesión con tu cuenta de Administrador</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="admin-form-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="Ingresa tu correo" required autocomplete="username">
        </div>

        <div class="admin-form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
        </div>

        <div id="loginError" class="login-error-msg" style="display: none;"></div>

        <button type="submit" id="btnLogin" class="btn-primary-admin">
          <span>INICIAR SESIÓN</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer-info">
        <small><i class="fa-solid fa-shield-halved"></i> Sistema CMS El Arabe Arquitecto.</small>
      </div>
    </div>

    <!-- 2. LIVE VISUAL EDITOR VIEW (IFRAME OF LANDING PAGE) -->
    <div id="viewVisualEditor" class="admin-view-panel active" style="display: none;">
      <iframe src="index.html" id="visualEditorIframe" class="visual-editor-iframe"></iframe>
    </div>

    <!-- 3. CONSULTAS RECIBIDAS VIEW -->
    <div id="viewConsultas" class="admin-view-panel" style="display: none;">
      <div class="container" style="padding-top: 1.5rem;">
        <div class="panel-card">
          <div class="panel-header">
            <div>
              <h3><i class="fa-solid fa-envelope-open-text" style="color: #d4af37;"></i> Consultas Recibidas</h3>
              <p>Mensajes enviados por los clientes desde el formulario de contacto.</p>
            </div>
          </div>

          <div id="adminConsultasList" class="consultas-table-wrapper">
            <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando consultas...</div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- FIREBASE SDK & ADMIN SCRIPT -->
  <script type="module" src="admin.js"></script>
</body>
</html>
